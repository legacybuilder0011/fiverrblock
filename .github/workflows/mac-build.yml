# Builds the macOS app on GitHub's Mac machines and attaches it to the release.
# Runs when a release is published (the Windows installer is uploaded from the
# PC first), or by hand from the Actions tab for an existing tag.
name: Mac build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.18.38"
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    defaults:
      run:
        working-directory: electron-app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build (ad-hoc signed, no Apple account)
        run: npx electron-builder --mac --publish never
      - name: Attach to release
        run: gh release upload "$TAG" dist/*.dmg dist/*.zip dist/latest-mac.yml --clobber
        env:
          GH_TOKEN: ${{ github.token }}
