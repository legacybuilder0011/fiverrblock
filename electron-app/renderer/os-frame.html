<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; user-select: none; position: relative; }
  body { font: 13px "Segoe UI", sans-serif; }
  body.mac { background: #ececec; color: #1d1d1f; }
  body.linux { background: #2d2d2d; color: #f4f4f4; }
  body.lights, body.cover { background: #323639; }
  .row { display: flex; align-items: center; height: 100%; gap: 16px; padding: 0 12px; box-sizing: border-box; }
  .lights { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  button {
    width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0,0,0,.25);
    padding: 0; color: transparent; font: 700 9px/12px "Segoe UI", sans-serif; cursor: pointer;
  }
  button:hover { color: rgba(0,0,0,.6); }
  body.mac .close { background: #ff5f57; }
  body.mac .min { background: #ffbd2e; }
  body.mac .zoom { background: #28c840; }
  body.linux .close { background: #e95420; color: transparent; }
  body.linux .min, body.linux .zoom { background: #5e5e5e; border-color: #3a3a3a; }
  body.linux button:hover { color: #fff; }
  .apple { width: 13px; height: 15px; display: block; }
  .app { font-weight: 700; }
  .item { color: inherit; }
  .linux-title { display: none; position: absolute; left: 0; right: 0; text-align: center; pointer-events: none; font-weight: 600; }
  body.linux .mac-only { display: none; }
  body.linux .linux-title { display: block; }
  body.lights .row { padding: 0; height: 100%; justify-content: center; background: transparent; }
  body.lights .mac-only, body.lights .linux-title { display: none; }
  body.cover .row { display: none; }
</style>
</head>
<body>
  <div class="row">
    <div class="lights">
      <button class="close" data-action="close" aria-label="Close">×</button>
      <button class="min" data-action="min" aria-label="Minimize">–</button>
      <button class="zoom" data-action="zoom" aria-label="Zoom">+</button>
    </div>
    <svg class="apple mac-only" viewBox="0 0 14 16" aria-hidden="true"><path fill="currentColor" d="M11.2 8.4c0-2 1.6-3 1.7-3.1-1-1.4-2.4-1.6-2.9-1.6-1.2-.1-2.4.7-3 .7s-1.6-.7-2.6-.7c-1.4 0-2.6.8-3.3 2-1.4 2.5-.4 6.1 1 8.1.7 1 1.5 2.1 2.5 2 .9 0 1.3-.6 2.5-.6s1.5.6 2.6.6 1.7-1 2.4-2c.8-1.1 1.1-2.2 1.1-2.2s-2-.8-2-3.2zM9.4 2.8c.5-.7.9-1.6.8-2.5-.8 0-1.7.5-2.2 1.2-.5.6-.9 1.5-.8 2.4.9.1 1.7-.4 2.2-1.1z"/></svg>
    <span class="app mac-only" id="appName">Chrome</span>
    <span class="item mac-only">File</span>
    <span class="item mac-only">Edit</span>
    <span class="item mac-only">View</span>
    <span class="item mac-only">History</span>
    <span class="item mac-only">Bookmarks</span>
    <span class="item mac-only">Window</span>
    <span class="item mac-only">Help</span>
    <div class="linux-title" id="linuxTitle">Chrome</div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    const kind = q.get("kind") === "linux" ? "linux" : "mac";
    const part = q.get("part") || "bar";
    const app = (q.get("app") || "Chrome").slice(0, 40);
    document.body.className = part === "lights" ? "lights " + kind : part === "cover" ? "cover" : kind;
    document.getElementById("appName").textContent = app;
    document.getElementById("linuxTitle").textContent = app;
    document.body.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button || !window.osFrame) return;
      window.osFrame.action(button.getAttribute("data-action"));
    });
  </script>
</body>
</html>
