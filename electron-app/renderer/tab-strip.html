<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Tabs</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #1a2130;
    color: #e2e8f0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    overflow: hidden;
    user-select: none;
  }
  #tabs-row {
    display: flex; align-items: flex-end;
    background: #0c0f14;
    height: 38px;
    padding-left: 4px;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
  }
  #tabs-row::-webkit-scrollbar { display: none; }
  .tab {
    display: flex; align-items: center;
    height: 34px;
    padding: 0 12px 0 14px;
    margin-right: 2px;
    background: #1a2130;
    border-radius: 8px 8px 0 0;
    border: 1px solid #252d3a;
    border-bottom: none;
    color: #94a3b8;
    min-width: 120px;
    max-width: 220px;
    cursor: pointer;
    flex-shrink: 0;
    transition: background .12s;
  }
  .tab:hover { background: #232b3a; color: #e2e8f0; }
  .tab.active { background: #1f2840; color: #f1f5f9; border-color: #3b82f6; }
  .tab-title {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 12px;
    margin-right: 8px;
  }
  .tab-close {
    width: 18px; height: 18px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #64748b; font-size: 14px;
    line-height: 1;
  }
  .tab-close:hover { background: #ef4444; color: #fff; }
  #new-tab {
    height: 34px; width: 34px;
    background: transparent;
    border: none;
    color: #94a3b8;
    font-size: 22px;
    cursor: pointer;
    border-radius: 6px;
    margin-left: 4px;
  }
  #new-tab:hover { background: #232b3a; color: #f1f5f9; }
  #url-row {
    display: flex; align-items: center;
    background: #1a2130;
    border-bottom: 1px solid #252d3a;
    height: 40px;
    padding: 0 8px;
    gap: 6px;
  }
  #brand-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 30px;
    padding: 0 10px;
    border: 1px solid #263247;
    border-radius: 15px;
    background: #0f172a;
    color: #dbeafe;
    font-weight: 700;
    letter-spacing: 0;
    white-space: nowrap;
  }
  #brand-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #2563eb;
    color: #fff;
    font-size: 10px;
  }
  .nav-btn {
    width: 30px; height: 30px;
    background: transparent;
    border: none;
    color: #94a3b8;
    font-size: 16px;
    cursor: pointer;
    border-radius: 6px;
  }
  .nav-btn:hover:not(:disabled) { background: #232b3a; color: #f1f5f9; }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }
  #url-input {
    flex: 1;
    height: 30px;
    background: #0f172a;
    border: 1px solid #252d3a;
    border-radius: 16px;
    color: #f1f5f9;
    padding: 0 14px;
    font-size: 13px;
    outline: none;
  }
  #url-input:focus { border-color: #3b82f6; }
  #profile-pill {
    max-width: 260px;
    height: 30px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 0 10px;
    border: 1px solid #263247;
    border-radius: 15px;
    background: #101827;
    color: #cbd5e1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pill-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #22c55e;
    flex: 0 0 auto;
  }
  @media (max-width: 640px) {
    #brand-text { display: none; }
    #brand-chip { padding: 0 6px; }
    #profile-pill { max-width: 96px; padding: 0 8px; }
  }
</style>
</head>
<body>
<div id="tabs-row">
  <button id="new-tab" title="New tab (Ctrl+T)">+</button>
</div>
<div id="url-row">
  <div id="brand-chip" title="Privacy Shield Browser"><span id="brand-mark">PS</span><span id="brand-text">Privacy Shield</span></div>
  <button class="nav-btn" id="btn-back" title="Back">&larr;</button>
  <button class="nav-btn" id="btn-fwd" title="Forward">&rarr;</button>
  <button class="nav-btn" id="btn-reload" title="Reload">&#8634;</button>
  <input type="text" id="url-input" placeholder="Enter URL or search..." />
  <div id="profile-pill" title="Profile identity"><span class="pill-dot"></span><span id="profile-pill-text">Profile</span></div>
  <button class="nav-btn" id="btn-home" title="Home">&#8962;</button>
</div>
<script src="tab-strip.js"></script>
</body>
</html>
